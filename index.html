</div>

<script>
const SUPA_URL = 'https://xdahfnorhnwsncaugbzn.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkYWhmbm9yaG53c25jYXVnYnpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjI5NTM2OTQsImV4cCI6MjAzODUyOTY5NH0.Pd6NMc6Rq8q1v2-EXAMPLE-REPLACE-WITH-REAL-ANON-KEY';

let allFixtures = [];
let selected = [];

function odds(prob){ return prob>0 ? (1 / (prob/100 * 0.94)).toFixed(2) : '1.90'; }

async function loadFixtures(){
  document.getElementById('fixtures').innerHTML = '<p class="text-center py-10 text-gray-400">Loading TODAY real form...</p>';
  try{
    const res = await fetch(`${SUPA_URL}/rest/v1/fixtures?select=*&order=edge.desc&limit=15`, {
      headers: { apikey: SUPA_KEY, Authorization: `Bearer ${SUPA_KEY}` }
    });
    let data = await res.json();
    if(!Array.isArray(data) || data.length===0){
      // fallback demo if empty
      data = [
        {home:'Gor Mahia',away:'AFC Leopards',league:'Kenya PL',date:'2026-08-28',time:'15:00',xg:2.55,xg_home:1.85,xg_away:0.7,p_over15:88.2,p_over25:62.1,p_over05_ht:72.5,p_btts:58.3,p_1x:78.2,p_homewin:52.1,edge:26.2,status:'demo'},

      document.getElementById('statusBadge').className='text-[10px] font-bold px-3 py-2 rounded-full bg-yellow-400 text-black';
    } else {
      document.getElementById('statusBadge').innerText='REAL DATA LIVE';
      document.getElementById('statusBadge').className='text-[10px] font-bold px-3 py-2 rounded-full bg-[#00ff88] text-black';

    allFixtures = data;
    render();
  }catch(e){
    document.getElementById('fixtures').innerHTML = '<p class="text-center py-10 text-red-400">Failed to load. Check SUPA_KEY!</p>';
  }
}

function render(){
  const container = document.getElementById('fixtures');
  document.getElementById('count').innerText = `${selected.length}/15`;
  if(allFixtures.length===0){ container.innerHTML='<p class="text-center py-10 text-gray-400">No games. Run feeder v13 FOREVER!</p>'; return; }

  // ACCA
  const accaCard = document.getElementById('accaCard');
  accaCard.classList.remove('hidden');
  const top2 = allFixtures.slice(0,2);
  const accaOdds = (parseFloat(odds(top2[0].p_over15)) * parseFloat(odds(top2[1].p_1x || top2[1].p_homewin))).toFixed(2);
  document.getElementById('accaTitle').innerText = `🔥 DAILY AUTO ACCA • ${accaOdds}x`;
  document.getElementById('accaLegs').innerHTML = top2.map(f => `• ${f.home} vs ${f.away} - Over1.5 @ ${odds(f.p_over15)}x (Edge +${f.edge}% | xGH ${f.xg_home||f.xg} xGA ${f.xg_away||0.9})<br>• ${f.home} vs ${f.away} - 1X @ ${odds(f.p_1x||f.p_homewin)}x`).join('<br>');
  document.getElementById('accaStake').innerText = `Stake 200 → Win ${Math.round(200*parseFloat(accaOdds))} → Profit ${Math.round(200*parseFloat(accaOdds)-200)}`;

  container.innerHTML = allFixtures.map((f, idx) => `
    <div class="bg-[#1c1c21] border rounded-[16px] p-3 mb-2 ${selected.includes(idx)? 'border-[#00ff88]' : 'border-[#2a2a32]'}">
      <div class="flex justify-between">
        <div>
          <div class="font-bold text-[14px] leading-tight">${f.home} vs ${f.away} <span class="text-[10px] text-gray-500 font-normal">${f.league||''}</span></div>
          <div class="text-[9px] text-gray-400 mt-1">xGH ${f.xg_home||f.xg} xGA ${f.xg_away||0.9} • Total xG ${f.xg} • ${f.time||''} • ${f.date||''} • Real Form</div>
        </div>
        <button onclick="toggle(${idx})" class="w-8 h-8 rounded-full border-2 flex items-center justify-center ${selected.includes(idx)? 'bg-[#00ff88] border-[#00ff88] text-black' : 'border-[#3a3a44]'}">${selected.includes(idx)? '✓' : ''}</button>
      </div>
      <div class="grid grid-cols-3 gap-1.5 mt-3">
        <div class="bg-[#2a2a32] rounded-full px-2 py-1.5 text-[9px] text-center"><div class="text-gray-400">Over0.5HT</div><div class="font-bold">@${odds(f.p_over05_ht||72)} ${f.p_over05_ht||72}%</div></div>
        <div class="bg-[#2a2a32] rounded-full px-2 py-1.5 text-[9px] text-center border border-[#00ff88]/30"><div class="text-gray-400">Over1.5</div><div class="font-bold">@${odds(f.p_over15)} ${f.p_over15}%</div></div>
        <div class="bg-[#2a2a32] rounded-full px-2 py-1.5 text-[9px] text-center"><div class="text-gray-400">Over2.5</div><div class="font-bold">@${odds(f.p_over25)} ${f.p_over25}%</div></div>
        <div class="bg-[#2a2a32] rounded-full px-2 py-1.5 text-[9px] text-center"><div class="text-gray-400">BTTS Yes</div><div class="font-bold">@${odds(f.p_btts||58)} ${f.p_btts||58}%</div></div>
        <div class="bg-[#00ff88] text-black rounded-full px-2 py-1.5 text-[9px] text-center font-bold"><div>1X</div><div>@${odds(f.p_1x||70)} ${f.p_1x||70}%</div></div>
        <div class="bg-[#2a2a32] rounded-full px-2 py-1.5 text-[9px] text-center"><div class="text-gray-400">Home Win</div><div class="font-bold">@${odds(f.p_homewin||45)} ${f.p_homewin||45}%</div></div>
      </div>
      <div class="flex gap-1.5 mt-2">
        <span class="bg-[#00ff88] text-black text-[10px] font-black px-3 py-1 rounded-full">Edge +${f.edge}%</span>
        <span class="bg-[#2a2a32] text-gray-300 text-[10px] px-3 py-1 rounded-full">Model ${(f.p_homewin||58)}% Real Form xGH ${f.xg_home||f.xg}</span>
      </div>
    </div>
  `).join('');
}

function toggle(i){
  if(selected.includes(i)) selected = selected.filter(x=>x!==i);
  else selected.push(i);
  render();
}
function buildACCA(){ alert('ACCA Builder: Pick 2-4 legs with highest Edge!'); }
function copySlip(){
  const text = document.getElementById('accaLegs').innerText;
  navigator.clipboard.writeText(text);
  alert('Copied to clipboard for Betika!');
}

loadFixtures();
</script>

tps:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
